name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 176.108.255.28
          username: user1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/user1/marketplace
            git pull origin main
            cd server
            npm install
            pm2 describe rks-api > /dev/null 2>&1 && pm2 restart rks-api || pm2 start index.js --name rks-api --env production
            pm2 save
            cd ..
            npm install
            VITE_API_URL=https://176-108-255-28.sslip.io npm run build
            sudo chmod -R 755 /home/user1/marketplace/dist
